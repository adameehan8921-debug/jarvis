<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>JARVIS UI</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      margin: 0;
      background: #030a0f;
      font-family: 'Courier New', monospace;
      color: #00d4ff;
    }

    .container {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .msg-user {
      text-align: right;
      margin: 10px 0;
    }

    .msg-ai {
      text-align: left;
      margin: 10px 0;
    }

    .bubble {
      display: inline-block;
      padding: 10px;
      border: 1px solid #00d4ff44;
      border-radius: 10px;
      max-width: 70%;
    }

    .input-bar {
      display: flex;
      border-top: 1px solid #00d4ff33;
      padding: 10px;
    }

    input {
      flex: 1;
      background: black;
      color: #00d4ff;
      border: none;
      padding: 10px;
    }

    button {
      background: #00d4ff22;
      color: #00d4ff;
      border: 1px solid #00d4ff;
      padding: 10px;
      cursor: pointer;
    }
  </style>
</head>

<body>
<div id="root"></div>

<script type="text/babel">

const SYSTEM_PROMPT = "You are
  Aira your you needs to act JARVIS, a smart assistant.";

function Jarvis() {
  const [messages, setMessages] = React.useState([]);
  const [input, setInput] = React.useState("");

  const sendMessage = async () => {
    if (!input.trim()) return;

    const newMsgs = [...messages, { role: "user", content: input }];
    setMessages(newMsgs);
    setInput("");

    try {
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-api-key": "YOUR_API_KEY"
        },
        body: JSON.stringify({
          model: "claude-sonnet-4-20250514",
          max_tokens: 300,
          system: SYSTEM_PROMPT,
          messages: newMsgs
        })
      });

      const data = await res.json();

      const reply = data?.content?.[0]?.text || "Error";

      setMessages([...newMsgs, { role: "assistant", content: reply }]);

    } catch (err) {
      setMessages([...newMsgs, { role: "assistant", content: "API error" }]);
    }
  };

  return (
    <div className="container">
      <div className="chat">
        {messages.map((m, i) => (
          <div key={i} className={m.role === "user" ? "msg-user" : "msg-ai"}>
            <div className="bubble">{m.content}</div>
          </div>
        ))}
      </div>

      <div className="input-bar">
        <input
          value={input}
          onChange={e => setInput(e.target.value)}
          onKeyDown={e => e.key === "Enter" && sendMessage()}
          placeholder="Enter command..."
        />
        <button onClick={sendMessage}>SEND</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Jarvis />);

</script>
</body>
</html>
